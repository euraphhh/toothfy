version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toothfy_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Sobrescreve a URL do banco do .env para apontar para o contêiner interno do DB
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/toothfy
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: toothfy_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=toothfy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toothfy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
